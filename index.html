<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Menu Atelier WORKS — 프로젝트·업무·자산·자금 관리 화면 미리보기">
  <title>Menu Atelier WORKS · 화면 미리보기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="login-layout">
  <div class="login-story">
    <span class="brand"><span class="brand-logo"><img src="brand-logo.png" alt="Menu Atelier"></span></span>
    <span class="eyebrow">Creating our asset value</span>
    <h1>메뉴 아틀리에의<br>프로젝트 및 자산 기록<br>아카이빙 서비스</h1>
    <p>메뉴 아틀리에의 프로젝트 · 자산 · 재무 관리 공간</p>
    <div class="story-foot">PROJECTS / ASSETS / MANAGEMENT</div>
  </div>
  <div class="login-panel">
    <form aria-describedby="preview-note">
      <span class="eyebrow">WORKSPACE PREVIEW</span>
      <h2>워크스페이스 미리보기</h2>
      <p class="muted" id="preview-note">서비스의 첫 화면을 미리 볼 수 있는 페이지입니다.<br>로그인과 데이터 저장은 지원하지 않습니다.</p>
      <label>아이디<input name="username" autocomplete="off" placeholder="미리보기에서는 입력할 수 없습니다" disabled></label>
      <label>비밀번호<input type="password" name="password" autocomplete="off" placeholder="미리보기에서는 입력할 수 없습니다" disabled></label>
      <button class="primary" type="button" disabled>로그인 준비 중</button>
      <p class="small muted">프로젝트 · 업무 · 자산 · 자금 관리 기능은<br>운영 서비스 연결 후 이용할 수 있습니다.</p>
    </form>
  </div>
</section>
</body>
</html>
